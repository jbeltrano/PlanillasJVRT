<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}PlanillasJVRT{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #222; background: #f5f5f5; }
    header { background: #1f3b5a; color: #fff; padding: .75rem 1rem; display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; }
    header a { color: #fff; }
    header .usuario { margin-left: auto; font-size: .9rem; }
    main { max-width: 900px; margin: 1rem auto; padding: 1rem; background: #fff; border-radius: 6px; box-sizing: border-box; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .5rem; border-bottom: 1px solid #ddd; }
    .mensaje { padding: .5rem .75rem; border-radius: 4px; margin: .5rem 0; background: #e6f4ea; }
    .error { background: #fdecea; }
    .campo { margin-bottom: .75rem; }
    .campo label { display: block; font-weight: 600; margin-bottom: .25rem; }
    .campo input, .campo select { width: 100%; box-sizing: border-box; padding: .5rem; font-size: 1rem; }
    .ayuda, .errorlist { font-size: .85rem; color: #666; margin: .25rem 0 0; padding-left: 1rem; }
    .errorlist { color: #b00020; }
    button, .boton { padding: .5rem 1rem; font-size: 1rem; background: #1f3b5a; color: #fff; border: 0; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; }
    header button { background: transparent; border: 1px solid #fff; padding: .25rem .6rem; font-size: .9rem; }
  </style>
</head>
<body>
  {% if user.is_authenticated %}
  <header>
    <strong>PlanillasJVRT</strong>
    {% if user.es_administrador %}<a href="{% url 'usuarios:dashboard' %}">Panel</a>{% endif %}
    <a href="{% url 'usuarios:password_cambiar' %}">Cambiar contraseña</a>
    <span class="usuario">{{ user.username }} ({{ user.get_tipo_usuario_display }})</span>
    <form method="post" action="{% url 'usuarios:logout' %}">
      {% csrf_token %}
      <button type="submit">Cerrar sesión</button>
    </form>
  </header>
  {% endif %}
  <main>
    {% for mensaje in messages %}
      <p class="mensaje {% if mensaje.tags == 'error' %}error{% endif %}">{{ mensaje }}</p>
    {% endfor %}
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
