{% if form.non_field_errors %}
  <div class="mensaje error">{{ form.non_field_errors|join:" " }}</div>
{% endif %}
{% for campo in form %}
  <div class="campo">
    <label for="{{ campo.id_for_label }}">{{ campo.label }}</label>
    {{ campo }}
    {% if campo.help_text %}<p class="ayuda">{{ campo.help_text|safe }}</p>{% endif %}
    {% if campo.errors %}<ul class="errorlist">{% for error in campo.errors %}<li>{{ error }}</li>{% endfor %}</ul>{% endif %}
  </div>
{% endfor %}
